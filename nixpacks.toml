[variables]
NIXPACKS_PHP_VERSION = "8.3"

# PENTING: nixPkgs eksplisit MENIMPA auto-deteksi provider. Karena proyek ini
# juga butuh Node (npm ci / npm run build dari package.json), paket "nodejs"
# WAJIB dicantumkan di sini — tanpanya build gagal "npm: command not found".
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.gd", "php83Extensions.exif", "php83Extensions.pdo_mysql", "php83Extensions.zip", "php83Extensions.intl", "nodejs"]
cmds = [
    "bash ensure-env.sh"
]

[phases.build]
cmds = [
    # Pastikan .env & APP_KEY ada SEBELUM tool apa pun yang memanggil
    # `php artisan key:generate` (mis. Nixpacks/Composer) — mencegah error
    # "file_get_contents(/app/.env): Failed to open stream" saat deploy.
    "chmod +x ensure-env.sh && bash ensure-env.sh",
    # Fail fast bila ekstensi GD tidak tersedia: laravolt/avatar butuh GD saat runtime.
    "php -m | grep -qi '^gd$' && echo 'GD OK' || (echo 'FATAL: php-gd tidak terpasang' && exit 1)",
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
    "php artisan view:clear",
    "php artisan cache:clear"
]

# CATATAN PENTING: JANGAN menambahkan [phases.deploy] di file ini.
# "deploy" BUKAN fase resmi Nixpacks (resmi: setup/install/build) — builder
# mengeksekusi fase tak dikenal di AWAL, SEBELUM composer install membuat
# vendor/, sehingga `php artisan ...` gagal dengan
# "require(/app/vendor/autoload.php): No such file" dan BUILD FAILED.
# Semua pekerjaan deploy (migrate, seed, config:cache) SUDAH ditangani
# start-web.sh yang jalan saat container START (lihat Procfile).

# Start command disamakan dengan Procfile (web: bash start-web.sh).
# php-fpm + nginx SENGAJA tidak dipakai: riwayat deploy menunjukkan binary
# php-fpm/nginx tidak terpasang andal di image Railway ("php-fpm: command not
# found"), yang membuat server gagal start -> 500 semua halaman.
# start-web.sh menjalankan ensure-env.sh (samakan .env + APP_KEY + DATABASE_URL)
# lalu `php artisan serve` di $PORT dinamis Railway.
[start]
cmd = "bash start-web.sh"
